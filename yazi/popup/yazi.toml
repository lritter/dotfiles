# yazi config for the tmux `<prefix> b` FLOATING POPUP only.
#
# Loaded via `display-popup -e YAZI_CONFIG_HOME=~/.config/yazi/popup`. It merges
# over yazi's built-in defaults, so this file only needs to state the overrides.
#
# Why: image preview inside a tmux display-popup crashes tmux on Ghostty — the
# Kitty-graphics render panics (ghostty-org/ghostty #4266), and popup preview is
# unsupported upstream (sxyazi/yazi #1724). Routing image/video/pdf to the `noop`
# previewer + preloader means the popup never emits terminal graphics, so it can't
# crash. Text/dir previews still work. Full image preview remains available when
# you run yazi in a normal pane (which uses ~/.config/yazi/yazi.toml).

[plugin]
prepend_previewers = [
	{ mime = "image/*", run = "noop" },
	{ mime = "video/*", run = "noop" },
	{ mime = "application/pdf", run = "noop" },
]
prepend_preloaders = [
	{ mime = "image/*", run = "noop" },
	{ mime = "video/*", run = "noop" },
	{ mime = "application/pdf", run = "noop" },
]
