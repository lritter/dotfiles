# gcloud auth: a status chip after the clock, and prefix G to re-authenticate.
# Sourced from tmux.conf after status-right is set. See bin/gcloud-reauth.
set -ga status-right "#(~/Local/bin/gcloud-reauth chip) "
bind G display-popup -w 70% -h 50% -T " gcloud re-auth " -E "~/Local/bin/gcloud-reauth login"
