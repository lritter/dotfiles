# The workmux sidebar is the window list. Sourced last in tmux.conf, after the
# catppuccin plugin has set the tab formats.

# prefix 1..9 jumps to that row of the sidebar (rows are numbered by {idx} in
# workmux/config.yaml), in any session, instead of to a window of this session.
run-shell 'for i in 1 2 3 4 5 6 7 8 9; do tmux bind $i run-shell "workmux sidebar jump $i"; done'

# Show only the current window's tab; the others are already in the sidebar.
set -g window-status-format ""
set -g window-status-separator ""

# No window number on that tab: prefix N follows the sidebar's numbering, not
# tmux's. Same pill as catppuccin's current-window tab, minus the number cap.
set -g window-status-current-format "#[fg=#181825,bg=#{@thm_surface_1},reverse]#[none]#[fg=#cdd6f4,bg=#{@thm_surface_1}]#W#{?window_zoomed_flag, [Z],}#{?@workmux_status, #{@workmux_status},}#[fg=#181825,reverse]#[none]"
