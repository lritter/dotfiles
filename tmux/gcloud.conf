# gcloud auth: a status chip after the clock, and prefix C-g to re-authenticate.
# Sourced from tmux.conf after status-right is set. See bin/gcloud-reauth.
set -ga status-right "#(~/Local/bin/gcloud-reauth chip) "
bind C-g display-popup -w 70% -h 50% -T " gcloud re-auth " -E "~/Local/bin/gcloud-reauth login"
# The chip sits at the far right, so give the line room before it truncates.
set -g status-right-length 150
