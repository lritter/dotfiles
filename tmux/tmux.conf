set-environment -gF TMUX_PLUGINS_PATH "$HOME/.config/tmux/plugins" 

# set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Show a zoom indicator on windows that have a zoomed (other panes hidden) pane
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag, [Z],}#{?#{==:#{@claude_state},working}, [~],}#{?#{==:#{@claude_state},waiting}, [!],}#{?#{==:#{@claude_state},idle}, [.],}"
set -g @catppuccin_window_text " #W#{?window_zoomed_flag, [Z],}#{?#{==:#{@claude_state},working}, [~],}#{?#{==:#{@claude_state},waiting}, [!],}#{?#{==:#{@claude_state},idle}, [.],}"

# Plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'alberti42/tmux-fzf-links'

# Status Bar
set -g status-left ""
# set -g status-right "#{E:@catppuccin_status_application}"
set-option -g status-position top

# Increase the length of the right status bar (default is usually too short for song titles)
set -g status-right-length 100
set -g status-right "#(~/.config/bash/bin/claude-statusline-reader.sh #{pane_tty} #{window_id})#(~/.config/bash/bin/current-spotify-track.sh)#[fg=default] %H:%M %d-%b-%y "
# set -g status-right "#(~/.config/bash/bin/claude-statusline-reader.sh #{pane_tty})#[fg=#89b4fa,bg=default]#[fg=#8ec07c,bg=default]#[fg=#1e1e2e,bg=#8ec07c]#(~/.config/bash/bin/current-spotify-track.sh)#[fg=#8ec07c,bg=default]#[fg=default] %H:%M %d-%b-%y "
# set -g status-right "#[fg=#282828,bg=#689d6a] #(~/.tmux/scripts/spotify.sh) #[default] ..."
set -g status-interval 5

# Set shell. Can't hardcode a path: Homebrew is /opt/homebrew on Apple Silicon and
# /usr/local on Intel. Can't just drop the line either: the MacBook's passwd shell is
# /bin/zsh, so tmux's fallback would land on zsh rather than bash there.
if-shell "[ -x /opt/homebrew/bin/bash ]" \
    "set-option -g default-shell /opt/homebrew/bin/bash" \
    "set-option -g default-shell /usr/local/bin/bash"

# Use vim keybindings in Tmux
setw -g mode-keys vi

# Enable mouse mode (optional but recommended)
set -g mouse on

# Set escape time to 0 (reduces lag when exiting insert mode in Neovim within Tmux)
set -sg escape-time 0

# Forward focus events to panes (lets nvim auto-reload files claude edits)
set -g focus-events on

# Let programs pass raw terminal escape sequences (DCS passthrough) through tmux,
# so terminal-graphics/capability queries reach the outer terminal. Required for
# yazi image preview in a normal pane; without it yazi's startup detection times
# out with the "Terminal response timeout (TRT)" error. (Note: image preview in a
# display-popup is a separate, unresolved upstream limitation on Ghostty.)
set -g allow-passthrough on

# Name windows by worktree dir, stable regardless of which pane is active
set -g allow-rename off
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Reset TMux Leader key to Ctrl+a
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Shortcut to reload Tmux config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Show a quick popup terminal
# Match against the session name string
# bind C-t if-shell -F '#{m:popup-*,#{session_name}}' \
#   'detach-client' \
#   'display-popup -w 80% -h 80% -E "tmux new-session -A -s popup-#{session_name} -d; tmux set -t popup-#{session_name} status off; tmux attach -t popup-#{session_name}"'

bind C-t if-shell -F '#{m:popup-*,#{session_name}}' \
  'detach-client' \
  'display-popup -w 80% -h 80% -E "tmux new-session -A -s popup-#{session_name} \"tmux set status off; exec \$SHELL\""'

# Also detach popup with C-d
bind C-d detach-client

# Use the system clipboard for copying
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
# Send selection to clipboard on mouse drag end
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Set fzf-links editor to open nvim in new tmux window
set-option -g @fzf-links-editor-open-cmd "tmux new-window -n 'nvim' nvim +%line '%file'"
set-option -g @fzf-links-browser-open-cmd "open -a 'Google Chrome' '%url'"

# Full-height left side-panes for lazygit / nvim / yazi, via a shared helper.
# The pane closes when the tool quits (native pane behavior). Re-pressing the
# key toggles: kill mode force-closes; focus mode (nvim) just re-focuses so
# unsaved edits are never force-killed. Yazi runs as a real pane (real PTY),
# which restores image preview and needs no popup/nested-session workaround.
bind g run-shell "~/.config/tmux/toggle-side-pane.sh lazygit kill '#{pane_current_path}' lazygit"
bind e run-shell "~/.config/tmux/toggle-side-pane.sh nvim focus '#{pane_current_path}' nvim"
bind b run-shell "~/.config/tmux/toggle-side-pane.sh yazi kill '#{pane_current_path}' yazi"

# Initialize TMUX plugin manager
run '$XDG_CONFIG_HOME/tmux/plugins/tpm/tpm'
# run '$HOMEBREW_PREFIX/opt/tpm/share/tpm/tpm'
